[package]
name = "melostore-sdk-rust"
version = "0.1.0"
edition = "2021"
authors = ["Teguh Yuhono"]
description = "Official unofficial Rust SDK for Melo H2H Public API (v1.4.0)"
license = "MIT"
keywords = ["melostore", "h2h", "sdk", "topup", "gaming"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
tokio = { version = "1.40", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.40", features = ["full"] }
